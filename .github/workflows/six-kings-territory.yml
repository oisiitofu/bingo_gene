name: Six Kings Territory Tick

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/six-kings-territory.yml"
      - "monster-system.js"
      - "territory-system.js"
      - "territory-equipment.js"
      - "city-system.js"
      - "tower-system.js"
      - "life-board-system.js"
      - "worker/territory-worker.mjs"
      - "scripts/tick-six-kings.mjs"
      - "firebase-database.rules.json"
      - "wrangler.jsonc"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-kings-territory-tick
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Advance shared game systems
        run: node scripts/tick-six-kings.mjs
